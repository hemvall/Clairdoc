services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clairdoc
      POSTGRES_USER: clairdoc
      POSTGRES_PASSWORD: clairdoc_dev_only
    ports:
      - "5432:5432"
    volumes:
      - clairdoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clairdoc -d clairdoc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clairdoc_pgdata:
